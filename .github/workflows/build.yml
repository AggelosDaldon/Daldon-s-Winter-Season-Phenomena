name: Forge 1.20.1 Build
on:
  push:
  pull_request:
  workflow_dispatch:
# Cancel superseded builds on any branch to keep only the newest attempt.
concurrency:
  group: daldon-forge-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build mod
        run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: daldon-winter-season-phenomena-forge-1.20.1
          path: build/libs/*.jar
